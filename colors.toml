# Moonlit Sands: a dark theme built from the wallpapers in backgrounds/, the night companion of Sunlit Sands.
# The sky and the lit ground are sampled from the open flat (1-sonoran-desert-flat); the text is the open flat's moon and
# the dry riverbed's moon highlight; the terminal colours are Sunlit Sands' hues drained and pulled toward the moon.
# Contrast ratios in comments are against `background`.
# Control states, for every app, pointer and keyboard alike: controls (buttons, fields, switches, chips) at rest
# dark_background with a 1px dark_foreground ring and foreground text; hovered or keyboard-focused, lighter_background
# with a 2px accent ring; pressed or on, selection with the resting ring; disabled text muted; accent buttons accent
# with background text and a 2px bright_foreground ring; destructive buttons red with bright_foreground text,
# bright_red on hover. Rows (lists, menus, sidebars, tabs, pickers) hovered or under the keyboard cursor
# lighter_background with no ring; selected, selection with bright_foreground text. Switches lighter_background off,
# accent on, knob background; dividers darker_background, card dividers, outlines and shadows dark_background.

mode = "dark"

# The moon's disc, sampled from the open flat, the truest moon gold: links, focus and hover rings, bar highlights and the top of the active window border, 7.6:1.
accent = "#eb9d52"
# Window borders. Omarchy's Hyprland template reads these two keys when present (otherwise a stock grey for
# unfocused and the accent for focused); each takes one colour or a gradient of slot names plus an angle.
# Unfocused: the panel sky, so idle frames sit in the night.
hyprland_inactive_border = "dark_background"
# Focused: the disc at the top edge to the riverbed highlight at the bottom, darker above and lighter below, so the frame reads as lit from low down.
hyprland_active_border = "accent bright_foreground 90deg"
# The edge of the open flat's lit path, sampled: selected text and the chosen row sit on ground the moon has reached, 1.7:1 over the page. Body text on it is 4.5:1.
selection = "#4e403c"
# Drained moonlight, not a sample: the body text's hue at low chroma and lightness 0.60, warm so it separates from the blue code. Line numbers, comments, inactive labels, panel names and dimmed text in the terminal agents; 4.2:1 on background, 4.6:1 on dark_background, 3.0:1 on the hover row.
muted = "#8b7d71"

# The three sky surfaces are the open flat's night sky, sampled; the raised surface is derived from selection.
# background is the body of the sky; dark_background the top of the frame; darker_background the darkest sky cluster across all six wallpapers.
# lighter_background is the hover row: selection one step darker by rule (same hue and chroma, OKLab lightness minus 0.05), 1.4:1 over the page, so hover is recessed sand and the chosen row the lit sand.
background = "#141d2d"
lighter_background = "#41332f"
dark_background = "#0e1622"
darker_background = "#0b111e"

# Moonlight text: the moon's disc, sampled from the open flat, with 20% of its chroma removed so long reading does not tire.
# 7.7:1, 5.5:1 on the hover row
foreground = "#e0a269"
# 3.8:1 on background, 4.1:1 on dark_background; dimmed text, placeholders and disabled items. The disc with lightness and colour lowered together, drained like the body text.
dark_foreground = "#9a6e45"
# 5.0:1, secondary text and graph labels. The disc with lightness and colour lowered together, drained like the body text.
light_foreground = "#b48153"
# The riverbed moon's highlight, sampled: cursor, bold text, terminal bright white and the bottom of the active window border, 9.7:1
bright_foreground = "#eeba8a"

# Terminal colours: Sunlit Sands' eight hues under the moon. Each day colour with 30% of its chroma removed at the same
# lightness, then pulled toward the moon's disc in OKLab: a quarter of the way for the six warm colours, a tenth for blue
# and cyan so they stay blue. Normals sit near 3.2:1 on the page, brown lower.
# coral rust, 3.3:1
red = "#ac5539"
# sun-gold, 3.3:1
yellow = "#8d662c"
# sun-warmed rock, 3.3:1
orange = "#a25a32"
# sage, 3.1:1
green = "#696e35"
# turquoise, 3.1:1
cyan = "#4b7172"
# cerulean, 3.2:1
blue = "#4e6f91"
# violet of the far mountains, 3.3:1
magenta = "#8b6377"
# dry wood, 2.5:1
brown = "#795331"

# Bright variants: Sunlit Sands' bright values treated the same way, about 4.3:1 to 4.6:1 against background,
# so bold and bright terminal text is clearly brighter than normal.
bright_red = "#cb6647"
bright_yellow = "#a37a39"
bright_green = "#7e8844"
bright_cyan = "#5d8e90"
bright_blue = "#6089b2"
bright_magenta = "#a67892"
