# Moonlit Sands: a dark theme.
# Contrast ratios in comments are against `background`.
# Control states, for every app, pointer and keyboard alike: controls (buttons, fields, switches, chips) at rest
# dark_background with a 1px dark_foreground ring and foreground text; hovered or keyboard-focused, lighter_background
# with a 2px accent ring; pressed or on, selection with the resting ring; disabled text muted; accent buttons accent
# with background text and a 2px bright_foreground ring; destructive buttons red with bright_foreground text,
# bright_red on hover. Rows (lists, menus, sidebars, tabs, pickers) hovered or under the keyboard cursor
# lighter_background with no ring; selected, selection with bright_foreground text. Switches lighter_background off,
# accent on, knob background; scrollbar thumb lighter_background at rest, accent under the pointer, bright_foreground
# while dragged; dividers darker_background, card dividers, outlines and shadows dark_background.

mode = "dark"

# The moon's disc: links, focus and hover rings, bar highlights and the top of the active window border, 7.6:1.
accent = "#eb9d52"
# Unfocused window border: dark_background.
hyprland_inactive_border = "dark_background"
# Focused window border: accent at the top edge to bright_foreground at the bottom.
hyprland_active_border = "accent bright_foreground 90deg"
# Selected text and the chosen row, 1.7:1 over the page. Body text on it is 4.5:1.
selection = "#4e403c"
# Line numbers, comments, inactive labels, panel names and dimmed text in the terminal agents; 4.2:1 on background, 4.6:1 on dark_background, 3.0:1 on the hover row.
muted = "#8b7d71"

# background is the body of the sky; lighter_background the hover row, 1.4:1 over the page; dark_background the top of the frame; darker_background the darkest sky.
background = "#141d2d"
lighter_background = "#41332f"
dark_background = "#0e1622"
darker_background = "#0b111e"

# Moonlight text; 7.7:1, 5.5:1 on the hover row
foreground = "#e0a269"
# 3.8:1 on background, 4.1:1 on dark_background; dimmed text, placeholders and disabled items.
dark_foreground = "#9a6e45"
# 5.0:1, secondary text and graph labels.
light_foreground = "#b48153"
# Cursor, bold text, terminal bright white and the bottom of the active window border, 9.7:1
bright_foreground = "#eeba8a"

# Terminal colours. Normals sit near 3.2:1 on the page, brown lower.
# coral rust, 3.3:1
red = "#ac5539"
# sun-gold, 3.3:1
yellow = "#8d662c"
# sun-warmed rock, 3.3:1
orange = "#a25a32"
# sage, 3.1:1
green = "#696e35"
# turquoise, 3.1:1
cyan = "#4b7172"
# cerulean, 3.2:1
blue = "#4e6f91"
# violet of the far mountains, 3.3:1
magenta = "#8b6377"
# dry wood, 2.5:1
brown = "#795331"

# Bright variants, about 4.3:1 to 4.6:1 against background.
bright_red = "#cb6647"
bright_yellow = "#a37a39"
bright_green = "#7e8844"
bright_cyan = "#5d8e90"
bright_blue = "#6089b2"
bright_magenta = "#a67892"
